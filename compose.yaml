# The API and the BFF as Production, in containers, against SQL Server -- the shape a deployment
# runs, on one machine. Not the development loop (engineering-practices.md, "Local setup").
#
# Every secret is required and has no default: set them in the shell, or in a git-ignored .env
# next to this file, before `docker compose up --build`. They are the values the local setup
# generates, spelled as environment variables:
#   SQL_SA_PASSWORD, JWT_SECRET, IDEMPOTENCY_HASH_KEY, STEPUP_BINDING_KEY, SERVICE_KEY,
#   AUDIT_CHAIN_KEY, AUDIT_ANCHOR_KEY, PIN_PEPPER
# A ninth, DEMO_CLIENT_KEY_SECRET, is needed only with compose.demo.yaml, whose header says what it
# is; nothing in this file reads it.
# The three connection strings below put SQL_SA_PASSWORD in single quotes, so it may hold `;` or
# `=`; a password that holds a single quote is not supported by this file.
# The database starts empty, and two one-shot containers of the tools image fill it before the API
# starts: `migrate` creates the database and brings it to the latest migration, then `seed` adds the
# demo users and their history (ADR-0060; backend/tools/AzureBank.Seeder/README.md has their
# variables and exit codes). Both run again on every `up` and change nothing the second time. One
# alone: `docker compose run --rm migrate`. (Until 2026-10-01 this header had the seed run from the
# host, with a command that drops the database first.)
# Then open http://localhost:5000.
# compose.demo.yaml, beside this file, turns the public demo on: `seed-pool` fills the database with
# the demo pool's private copies in place of `seed`'s four users (ADR-0062). Its header has how, and
# what a later `up` builds there: a new set, once its copies are 44 hours old.
#
# The API has no address of its own: it shares the BFF's network namespace and listens on
# 127.0.0.1:5068, so the BFF reaches it over loopback -- the one plain-HTTP hop the BFF accepts --
# and nothing else can (ADR-0055). The same shape as a Container Apps sidecar.

name: azurebank

x-tools: &tools
  build:
    context: .
    dockerfile: backend/tools/AzureBank.Seeder/Dockerfile
  # One image for both one-shots, named like the other two: <project>-tools.
  image: ${COMPOSE_PROJECT_NAME}-tools

services:
  sqlserver:
    # A fixed cumulative update, the one the 24-of-24 run was measured on (16.0.4295.3, digest
    # sha256:4402d880dd4c…), not 2022-latest, which moves under a fresh install. Move it on purpose.
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}
    # 14330, not 1433: a SQL Server installed on the host usually holds 1433, and publishing over it
    # does not fail -- measured on 2026-09-25, the seed then reached the host's instance and got
    # "Login failed for user 'sa'" (18456) while the container sat healthy and empty.
    ports:
      - "127.0.0.1:14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Exits 0 once the database is at the latest migration. It waits up to 60 s for SQL Server to
  # accept a connection, so a server that is healthy and still starting its databases is covered.
  # It gets the connection string and no other secret.
  migrate:
    <<: *tools
    command: ["migrate"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AzureBank;User Id=sa;Password='${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}';TrustServerCertificate=true"

  # Exits 0 once the demo data is there: it fills an empty database and leaves a seeded one alone.
  # The pepper is the API's, or the seeded PINs would not verify.
  seed:
    <<: *tools
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AzureBank;User Id=sa;Password='${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}';TrustServerCertificate=true"
      Security__PinPepper: ${PIN_PEPPER:?set PIN_PEPPER}

  bff:
    build:
      context: .
      dockerfile: backend/src/AzureBank.Bff/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceCredential__BffKey: ${SERVICE_KEY:?set SERVICE_KEY}
      BackendApi__BaseUrl: http://localhost:5068
      # The cluster id carries a hyphen; an environment map takes it as it is.
      ReverseProxy__Clusters__backend-api__Destinations__primary__Address: http://localhost:5068
    ports:
      - "127.0.0.1:5000:8080"

  api:
    build:
      context: .
      dockerfile: backend/src/AzureBank.Api/Dockerfile
    network_mode: "service:bff"
    depends_on:
      sqlserver:
        condition: service_healthy
      # The API starts on a migrated and seeded database, or not at all.
      seed:
        condition: service_completed_successfully
      bff:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5068
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AzureBank;User Id=sa;Password='${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}';TrustServerCertificate=true"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET}
      Idempotency__HashKey: ${IDEMPOTENCY_HASH_KEY:?set IDEMPOTENCY_HASH_KEY}
      StepUp__BindingKey: ${STEPUP_BINDING_KEY:?set STEPUP_BINDING_KEY}
      ServiceCredential__BffKey: ${SERVICE_KEY:?set SERVICE_KEY}
      Audit__ChainKey: ${AUDIT_CHAIN_KEY:?set AUDIT_CHAIN_KEY}
      Audit__AnchorKey: ${AUDIT_ANCHOR_KEY:?set AUDIT_ANCHOR_KEY}
      Security__PinPepper: ${PIN_PEPPER:?set PIN_PEPPER}
