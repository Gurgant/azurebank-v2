# The API and the BFF as Production, in containers, against SQL Server -- the shape a deployment
# runs, on one machine. Not the development loop (engineering-practices.md, "Local setup").
#
# Every secret is required and has no default: set them in the shell, or in a git-ignored .env
# next to this file, before `docker compose up --build`. They are the values the local setup
# generates, spelled as environment variables:
#   SQL_SA_PASSWORD, JWT_SECRET, IDEMPOTENCY_HASH_KEY, STEPUP_BINDING_KEY, SERVICE_KEY,
#   AUDIT_CHAIN_KEY, AUDIT_ANCHOR_KEY, PIN_PEPPER
# The database starts empty; seed it once from the host, against the published port:
#   ConnectionStrings__DefaultConnection="Server=127.0.0.1,14330;Database=AzureBank;User Id=sa;Password=$SQL_SA_PASSWORD;TrustServerCertificate=true" \
#   Security__PinPepper="$PIN_PEPPER" DOTNET_ENVIRONMENT=Development \
#   dotnet run --project backend/tools/AzureBank.Seeder -- reset --confirm
# Then open http://localhost:5000.
#
# The API has no address of its own: it shares the BFF's network namespace and listens on
# 127.0.0.1:5068, so the BFF reaches it over loopback -- the one plain-HTTP hop the BFF accepts --
# and nothing else can (ADR-0055). The same shape as a Container Apps sidecar.

name: azurebank

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}
    # 14330, not 1433: a SQL Server installed on the host usually holds 1433, and publishing over it
    # does not fail -- measured on 2026-09-25, the seed then reached the host's instance and got
    # "Login failed for user 'sa'" (18456) while the container sat healthy and empty.
    ports:
      - "127.0.0.1:14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  bff:
    build:
      context: .
      dockerfile: backend/src/AzureBank.Bff/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceCredential__BffKey: ${SERVICE_KEY:?set SERVICE_KEY}
      BackendApi__BaseUrl: http://localhost:5068
      # The cluster id carries a hyphen; an environment map takes it as it is.
      ReverseProxy__Clusters__backend-api__Destinations__primary__Address: http://localhost:5068
    ports:
      - "127.0.0.1:5000:8080"

  api:
    build:
      context: .
      dockerfile: backend/src/AzureBank.Api/Dockerfile
    network_mode: "service:bff"
    depends_on:
      sqlserver:
        condition: service_healthy
      bff:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5068
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AzureBank;User Id=sa;Password=${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD};TrustServerCertificate=true"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET}
      Idempotency__HashKey: ${IDEMPOTENCY_HASH_KEY:?set IDEMPOTENCY_HASH_KEY}
      StepUp__BindingKey: ${STEPUP_BINDING_KEY:?set STEPUP_BINDING_KEY}
      ServiceCredential__BffKey: ${SERVICE_KEY:?set SERVICE_KEY}
      Audit__ChainKey: ${AUDIT_CHAIN_KEY:?set AUDIT_CHAIN_KEY}
      Audit__AnchorKey: ${AUDIT_ANCHOR_KEY:?set AUDIT_ANCHOR_KEY}
      Security__PinPepper: ${PIN_PEPPER:?set PIN_PEPPER}
