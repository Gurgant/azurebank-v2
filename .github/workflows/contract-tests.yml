# The Bruno collection against a live API + SQL Server.
# Manual trigger only (workflow_dispatch): heavier than CI and not part of the
# push gate. Adapted from the January 2026 workflow; the API now needs the
# Seeder to create/seed the database (no auto-migration at startup) and its six
# secrets via environment (appsettings.Development.json is not committed). The
# "Start API" step below spells README.md's recipe with `__`, taking the throwaway
# values from this workflow's `env:` block.
#
# Schemathesis left this file on 2026-09-15: it is the `conformance` job in ci.yml now, per PR
# and gating, after two months in which the job here ran zero times (its `--junit-xml` option
# had been renamed in Schemathesis 4.0, and its step ended in `|| true`). ADR-0053 D6.
name: Contract tests (manual)

on:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (CodeQL
# actions/missing-workflow-permissions). This job only reads the repo, stands up SQL Server
# and the API, and uploads artifacts — none of that writes back through this token.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # CI-only throwaway values; the database and API live only for this job.
  CONNECTION_STRING: "Server=localhost,1433;Database=AzureBankTest;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=true"
  JWT_SECRET: "ci-only-throwaway-signing-key-0123456789abcdef0123456789abcdef"
  IDEMPOTENCY_HASH_KEY: "ci-only-throwaway-idempotency-hmac-key-0123456789abcdef"
  # ADR-0042, and deliberately NOT the same value as IDEMPOTENCY_HASH_KEY. Required:
  # StepUp:BindingKey is ValidateOnStart, so an unset value crashes the API at startup.
  STEPUP_BINDING_KEY: "ci-only-throwaway-stepup-binding-key-0123456789abcdef"
  # ADR-0055: the API serves only a caller that presents this key. Bruno presents it from
  # tests/api-collection/collection.bru, which reads serviceKey from the environment file.
  SERVICE_CREDENTIAL_KEY: "ci-only-throwaway-service-credential-0123456789abcdef"
  # ADR-0044. ValidateOnStart like the three above, so an unset value is a startup crash.
  AUDIT_CHAIN_KEY: "ci-only-throwaway-audit-chain-key-0123456789abcdef"
  AUDIT_ANCHOR_KEY: "ci-only-throwaway-audit-anchor-key-fedcba9876543210"
  # PIN-hash pepper (ADR-0011). The Seeder and the API MUST share this value,
  # otherwise seeded demo PINs cannot be verified.
  PIN_PEPPER: "ci-only-throwaway-pin-pepper-0123456789abcdef0123456789"

jobs:
  bruno:
    name: Bruno collection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: YourStrong@Passw0rd123
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Create and seed database
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Security__PinPepper: ${{ env.PIN_PEPPER }}
        run: |
          dotnet run --project tools/AzureBank.Seeder -- reset --confirm
          dotnet run --project tools/AzureBank.Seeder -- seed

      - name: Start API
        working-directory: backend/src/AzureBank.Api
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Jwt__Secret: ${{ env.JWT_SECRET }}
          Idempotency__HashKey: ${{ env.IDEMPOTENCY_HASH_KEY }}
          StepUp__BindingKey: ${{ env.STEPUP_BINDING_KEY }}
          ServiceCredential__BffKey: ${{ env.SERVICE_CREDENTIAL_KEY }}
          Audit__ChainKey: ${{ env.AUDIT_CHAIN_KEY }}
          Audit__AnchorKey: ${{ env.AUDIT_ANCHOR_KEY }}
          Security__PinPepper: ${{ env.PIN_PEPPER }}
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --urls "http://localhost:5068" &
          sleep 20

      - name: Run Bruno tests
        working-directory: tests/api-collection
        run: |
          bru run . --env ci \
            --reporter-junit ../../bruno-results.xml \
            || true  # report, don't gate

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-results
          path: bruno-results.xml
