name: Pages

# Publishes the folder site/ as it is, with no build: the entry page of the live demo, at
# https://gurgant.github.io/azurebank-v2/ . From main only.
# The repository's Pages setting must say "Source: GitHub Actions"; this workflow does not set it.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Nothing by default: the job names what it needs.
permissions: {}

jobs:
  publish:
    name: Publish the entry page
    runs-on: ubuntu-24.04
    # deploy-pages gives up by itself after 10 minutes, its default; the steps before it take
    # seconds.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, and one that has started is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    # What deploy-pages asks for: `pages` to create the deployment, and `id-token` for the OIDC
    # token in which GitHub reads the run's branch before it accepts the deployment.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Each action is pinned to a full commit, not a tag, as the sign-in to Azure is in deploy.yml:
    # this job publishes the site and is handed an OIDC token. The comment names the release.
    steps:
      - name: Refuse any branch but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The entry page is published from main only."
          exit 1
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Read the Pages setting
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # actionlint 1.7.12, which ci.yml runs on this file, checks no input of an action pinned to
      # a commit: measured on 2026-10-07 with an input that does not exist, nothing is reported.
      # `path` is an input in the action.yml of v5.0.0.
      - name: Upload the folder site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
