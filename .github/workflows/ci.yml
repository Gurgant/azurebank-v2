name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN, inherited by every job (CodeQL
# actions/missing-workflow-permissions). Nothing here writes to the repo: the steps are
# checkout, setup-*, build/test and upload-artifact — and upload-artifact@v4 authenticates
# with the Actions runtime token, not this one. A job that ever needs more declares its own
# narrower block rather than widening this default.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `actions/checkout` writes the GITHUB_TOKEN into .git/config by default, and every job
          # here then runs third-party code that could read it — NuGet restore, `dotnet run` on the
          # app itself, `npm ci` with its postinstall scripts. No job performs an authenticated git
          # operation (the only git use is a local `git diff --exit-code` drift check), so the
          # credential is pure blast radius. zizmor flags this as `artipacked`.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore AzureBank.slnx

      - name: Build
        working-directory: backend
        run: dotnet build AzureBank.slnx --no-restore --configuration Release

      # No DB or secrets needed: the test fixture runs on the EF InMemory
      # provider and supplies its own test-only JWT secret. The 14 skipped
      # tests are the explicit SQL-Server-only ones.
      - name: Test
        working-directory: backend
        run: >
          dotnet test tests/AzureBank.Tests/AzureBank.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      # BFF gateway integration tests (edge rate limiter, ADR-0013). InMemory /
      # no DB or backend needed — the limiter rejects before the proxy runs.
      - name: Test BFF
        working-directory: backend
        run: >
          dotnet test tests/AzureBank.Bff.Tests/AzureBank.Bff.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=bff-test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/tests/AzureBank.Tests/TestResults/
            backend/tests/AzureBank.Bff.Tests/TestResults/

  # The idempotency single-execution guarantee and the balance optimistic-
  # concurrency retry depend on REAL SQL Server semantics (unique-key races,
  # concurrency tokens, transactions); the InMemory provider only
  # approximates them. This job runs exactly those proofs against a mssql
  # container (Category=SqlServer trait; they self-skip elsewhere).
  backend-sql:
    name: Backend concurrency proofs (SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          # CI-only throwaway credentials; the database lives only for this job.
          SA_PASSWORD: YourStrong@Passw0rd123
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore AzureBank.slnx

      - name: Build
        working-directory: backend
        run: dotnet build AzureBank.slnx --no-restore --configuration Release

      - name: Concurrency proofs on SQL Server
        working-directory: backend
        env:
          AZUREBANK_TEST_SQLSERVER: "Server=localhost,1433;Database=AzureBankProofs;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=true"
        run: >
          dotnet test tests/AzureBank.Tests/AzureBank.Tests.csproj
          --no-build --configuration Release
          --filter "Category=SqlServer"
          --logger "trx;LogFileName=sql-test-results.trx"

      # A [SqlServerFact] SKIPS when AZUREBANK_TEST_SQLSERVER is missing or unusable, and a run of
      # nothing but skips still EXITS 0 — so the step above goes green whether it proved anything or
      # not. That is the whole failure mode this job exists to prevent, so assert the count rather
      # than the colour: if the service container or the connection string ever breaks, this fails
      # loudly instead of quietly certifying an empty run.
      - name: Assert the proofs actually ran
        working-directory: backend
        run: |
          trx=$(find . -name 'sql-test-results.trx' | head -1)
          if [ -z "$trx" ]; then echo "::error::no trx produced by the SQL proofs"; exit 1; fi
          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | grep -o '[0-9]*')
          passed=$(grep -o ' passed="[0-9]*"' "$trx" | head -1 | grep -o '[0-9]*')
          echo "SQL proofs: executed=$executed passed=$passed"
          if [ "${executed:-0}" -eq 0 ] || [ "$executed" != "$passed" ]; then
            echo "::error::SQL proofs did not run (executed=$executed passed=$passed) — the suite skipped instead of proving anything"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-sql-test-results
          path: backend/tests/AzureBank.Tests/TestResults/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: API schema up to date
        working-directory: frontend
        # The FE↔BE contract gate: regenerate schema.d.ts from the committed OpenAPI spec
        # and fail if it differs from what's checked in — spec drift becomes a red build,
        # never a runtime surprise.
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts

      - name: Zod schemas up to date
        working-directory: frontend
        # Same gate for the RUNTIME validators: the spec-generated Zod schemas must match
        # the committed spec, so the strict money-response parsing can never drift silently.
        run: |
          npm run generate:zod
          git diff --exit-code src/api/generated/apiSchemas.ts

      - name: Test
        working-directory: frontend
        run: npm test

      # The MOCK half of the two-target contract suite (ADR-0029). It ran in no job at all until
      # now: `npm test` above excludes `src/contract/**` so a unit run never needs a stack, and the
      # only contract step in this workflow is `test:contract:real`, down in the real-stack job.
      #
      # That left the ADR titled "making mock drift fail the build" delivering half of it. The real
      # target proves the ASSERTIONS match the backend; nothing proved the MOCK still matches those
      # same assertions — while every one of the 596 unit tests uses that mock as its oracle. An
      # oracle nothing checks is the state ADR-0029 exists to prevent.
      #
      # It belongs here rather than beside `test:contract:real` because it needs nothing: node
      # environment, MSW in-process, ~2.5s. Waiting on SQL Server and two services to find out the
      # mock drifted would be paying the expensive job's price for the cheap half.
      #
      # No "did it actually run" guard, deliberately — unlike the dotnet SQL proofs, vitest exits 1
      # when its include glob matches nothing, so an empty run already fails.
      - name: Contract conformance (mock target)
        working-directory: frontend
        run: npm run test:contract:mock

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------------------
  # The unit suite AGAIN, in two zones that are not Greenwich.
  #
  # Every other job here runs in UTC, and UTC is the one zone in which a whole class of defect
  # cannot be seen: anything that anchors on the LOCAL calendar while its oracle anchors on the
  # UTC one agrees with itself on exactly this meridian. The mock ledger did precisely that for a
  # month -- seeded from UTC midnight of the 1st while the dashboard asks for local midnight --
  # and the guard that should have caught it measured the UTC window too. Measured 2026-09-02
  # with the real seed: a viewer at UTC-8 lost 5 of 25 rows from the month card, 24 of 25 at
  # 00:30 local on the 1st; at UTC+2 on the 1st the card read EUR 0.00 over a full ledger. Green
  # in CI throughout.
  #
  # Two zones, one each side, chosen for having NO daylight-saving transition to land on:
  # Asia/Tokyo is UTC+9 all year, and America/Los_Angeles is included because it is the common
  # western case -- its DST change is at 02:00 local on a Sunday in March/November, which the
  # month-boundary tests never sit on.
  #
  # Only `npm test` runs here. Lint, format, schema drift and the build are zone-independent and
  # already ran above; repeating them would triple that job's cost for nothing.
  #
  # Linux honours TZ= for Node. Windows does not -- measured, both bare `node` and vitest ignore
  # it there -- which is why this exists as a CI job rather than an npm script.
  # ---------------------------------------------------------------------------------------
  frontend-tz:
    name: Frontend tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Los_Angeles, Asia/Tokyo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The zone must reach the WORKER, not just this shell: vitest forks its workers and they
      # inherit the environment, but that is the claim under test, so it is asserted rather than
      # assumed. A runner that silently ran in UTC would make both legs of this matrix a lie.
      - name: Assert the zone reached Node
        working-directory: frontend
        run: |
          node -e '
            const off = new Date().getTimezoneOffset();
            console.log(`TZ=${process.env.TZ} offset=${off}`);
            if (off === 0) {
              console.error("Node is still in UTC; TZ was not honoured");
              process.exit(1);
            }
          '

      - name: Test
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------------------
  # Phase 4 (ADR-0032): the three REAL-BACKEND layers, against a stack this job owns.
  #
  # ADR-0029/0030/0031 each shipped with the same two caveats — money accumulates in a shared
  # dev database, and the BFF's auth budget is per IP. Both dissolve here rather than being
  # documented again: this job creates its own SQL Server, its own database and its own API +
  # BFF processes, so nothing is shared with a developer's machine or with another job.
  # ---------------------------------------------------------------------------------------
  real-stack:
    name: Real-stack layers (contract + integration + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          # CI-only throwaway credentials; the database lives only for this job.
          SA_PASSWORD: YourStrong@Passw0rd123
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_NOLOGO: true
      # CI-only throwaway values, mirroring contract-tests.yml so the two stay recognisably
      # the same recipe. The Seeder and the API MUST share PIN_PEPPER (ADR-0011) or the
      # seeded PIN cannot be verified — which would break every step-up assertion.
      CONNECTION_STRING: "Server=localhost,1433;Database=AzureBankE2E;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=true"
      JWT_SECRET: "ci-only-throwaway-signing-key-0123456789abcdef0123456789abcdef"
      IDEMPOTENCY_HASH_KEY: "ci-only-throwaway-idempotency-hmac-key-0123456789abcdef"
      # ADR-0042. A SEPARATE key from IDEMPOTENCY_HASH_KEY on purpose: the two hashes answer
      # different questions, so one leaked key must not forge the other's answer. Required —
      # StepUp:BindingKey is ValidateOnStart, so an unset value is a startup crash, not a
      # degraded run.
      STEPUP_BINDING_KEY: "ci-only-throwaway-stepup-binding-key-0123456789abcdef"
      # ADR-0044, and separate again for the same reason: this one keys the audit hash chain.
      # Also ValidateOnStart, so leaving it unset does not degrade the audit trail — it stops
      # the API from starting at all.
      AUDIT_CHAIN_KEY: "ci-only-throwaway-audit-chain-key-0123456789abcdef"
      AUDIT_ANCHOR_KEY: "ci-only-throwaway-audit-anchor-key-fedcba9876543210"
      PIN_PEPPER: "ci-only-throwaway-pin-pepper-0123456789abcdef0123456789"
      # The suites expect the dev topology: API on 5068 (http — no dev cert in CI), BFF on 5000.
      API_URL: "http://localhost:5068"
      BFF_URL: "http://localhost:5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create and seed database
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Security__PinPepper: ${{ env.PIN_PEPPER }}
        run: |
          dotnet run --project tools/AzureBank.Seeder -- reset --confirm
          dotnet run --project tools/AzureBank.Seeder -- seed

      - name: Start API
        working-directory: backend/src/AzureBank.Api
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Jwt__Secret: ${{ env.JWT_SECRET }}
          Idempotency__HashKey: ${{ env.IDEMPOTENCY_HASH_KEY }}
          StepUp__BindingKey: ${{ env.STEPUP_BINDING_KEY }}
          Audit__ChainKey: ${{ env.AUDIT_CHAIN_KEY }}
          Audit__AnchorKey: ${{ env.AUDIT_ANCHOR_KEY }}
          Security__PinPepper: ${{ env.PIN_PEPPER }}
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --urls "${{ env.API_URL }}" > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "API starting, log at $RUNNER_TEMP/api.log"

      - name: Start BFF
        working-directory: backend/src/AzureBank.Bff
        env:
          Jwt__Secret: ${{ env.JWT_SECRET }}
          ASPNETCORE_ENVIRONMENT: Development
        # The BFF reaches the API two ways and BOTH must be redirected off the dev HTTPS default
        # (https://localhost:7215): the YARP cluster for proxied /api/* traffic, and the named
        # "BackendApi" client the auth controller and TokenRefresher use directly (Program.cs:148
        # dereferences it with `!`, so an unset value is a startup crash).
        #
        # Passed as COMMAND-LINE config, not env vars, and that is not cosmetic: the cluster id is
        # `backend-api`, and the env-var form would need a HYPHEN in the variable name
        # (ReverseProxy__Clusters__backend-api__...), which is not a portable shell identifier. The
        # command-line provider takes colon-separated keys and has no such restriction.
        #
        # RateLimiting:AuthPermitLimit is environmental, NOT a weakened assertion. The three suites
        # together spend about ten auth requests, which is exactly the production limit of 10 per
        # 60s per IP — back-to-back in one job they would rate-limit each other and go red for a
        # reason unrelated to the code under test. The limiter itself is proven by
        # AzureBank.Bff.Tests' own rate-limiter test; nothing in these three suites asserts it.
        run: |
          nohup dotnet run --urls "${{ env.BFF_URL }}" -- \
            --BackendApi:BaseUrl="${{ env.API_URL }}" \
            --ReverseProxy:Clusters:backend-api:Destinations:primary:Address="${{ env.API_URL }}" \
            --RateLimiting:AuthPermitLimit=1000 \
            > "$RUNNER_TEMP/bff.log" 2>&1 &
          echo "BFF starting, log at $RUNNER_TEMP/bff.log"

      - name: Wait for the stack
        # Poll the real readiness endpoints instead of sleeping. A fixed sleep is either too
        # short (flaky red) or too long (wasted minutes), and it hides WHICH process failed.
        run: |
          wait_for() {
            local name="$1" url="$2"
            for i in $(seq 1 60); do
              if curl -fsS --max-time 3 "$url" > /dev/null 2>&1; then
                echo "$name ready after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name never became ready at $url"
            return 1
          }
          wait_for API "${{ env.API_URL }}/health/ready" || { cat "$RUNNER_TEMP/api.log"; exit 1; }
          wait_for BFF "${{ env.BFF_URL }}/health/ready" || { cat "$RUNNER_TEMP/bff.log"; exit 1; }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Contract suite against the REAL backend
        working-directory: frontend
        run: npm run test:contract:real

      - name: Integration suite (the app's own data layer)
        working-directory: frontend
        run: npm run test:integration

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E (real browser)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: |
          echo "===== API ====="; tail -n 200 "$RUNNER_TEMP/api.log" || true
          echo "===== BFF ====="; tail -n 200 "$RUNNER_TEMP/bff.log" || true
