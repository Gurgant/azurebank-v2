<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AzureBank</title>
    <meta
      name="description"
      content="Personal banking — accounts, transfers and transaction history, with money operations that execute exactly once."
    />

    <!-- The ICO carries 16/32/48 and the PNG covers higher-density displays. There is deliberately
         no SVG favicon: the only one available embeds two base64 rasters (light and dark variants
         swapped by a media query) and weighs 760 KB, which is not a price worth paying on every
         cold load for a tab icon. A real vector would be welcome; a raster in vector clothing is
         not. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0077b6" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
