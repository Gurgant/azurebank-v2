<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AzureBank</title>
    <meta
      name="description"
      content="Personal banking — accounts, transfers and transaction history, with money operations that execute exactly once."
    />

    <!-- Every icon here is rendered from favicon.svg at its own native size rather than downscaled
         from one large PNG. At 512 that makes no difference; at 16 it is the difference between a
         legible mark and a smudge, because the rasteriser places the antialiasing with the geometry
         in hand. The whole set regenerates with one command — see docs/brand-assets.md. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0077b6" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
