# compose.yaml with the public demo turned on, on one machine. With the variables compose.yaml asks
# for and one more, DEMO_CLIENT_KEY_SECRET (32 characters or more: the API refuses a shorter one at
# start):
#   docker compose -f compose.yaml -f compose.demo.yaml up --build
#
# What changes. The API and the BFF run with Demo__Enabled=true: POST /bff/auth/demo/claim hands a
# visitor a private copy and its password, registration is closed (403 REGISTRATION_CLOSED from
# either), and only the owner of a claimed copy can sign in. The API alone is given
# DEMO_CLIENT_KEY_SECRET, as Demo__ClientKeySecret: on the copy a client claims it stores that
# client's address only as a hash under this key.
# The `seed` one-shot runs `seed-pool` in place of `seed`, with Demo__Enabled=true:
# the database gets the demo pool's free copies (Demo:Pool:TargetFree of them, 50 by default), not
# the four users whose password and PIN are in this repository (ADR-0062). The API starts once it
# has exited 0, as before. A free copy has no password, so none can be signed in to until it is
# claimed.
#
# One volume, one kind of database. A volume this file filled holds the pool, and `seed` and
# `reset` refuse it (exit 2) under compose.yaml alone; a volume compose.yaml filled holds the four
# fixed users, and `seed-pool` exits 13 on it, writing nothing. Either way the API does not start:
# `docker compose down -v` before changing files.
#
# Every `up` runs `seed-pool` again. It builds nothing while the pool holds its free copies, and once
# they are older than 44 hours (Demo:Pool:MaxFreeAgeHours) it builds a new set beside them: only
# `recycle` deletes the old ones.
#
# No number of the demo is set here, so every service runs on the defaults
# (backend/tools/AzureBank.Seeder/README.md lists them). A value written under one service reaches
# no other: give it to every service that reads it. Demo__CopyLifetimeHours goes to `api`, which
# ends a copy by it, and to `recycle`, which deletes by it; Demo__Claim__MaxPerClientPerDay to
# `api`, which refuses a client by it, and to `seed` and `recycle`, whose line counts the clients
# at their cap by it.
#
# `recycle`, the job a deployment runs on a schedule, is a service here under the profile `pool`,
# so `up` leaves it out and it runs when asked:
#   docker compose -f compose.yaml -f compose.demo.yaml run --rm recycle
# Options of a command go after the service name, as in compose.yaml:
#   docker compose -f compose.yaml -f compose.demo.yaml run --rm seed seed-pool 5
# backend/tools/AzureBank.Seeder/README.md has the two commands' exit codes, and
# docs/runbooks/demo-pool.md what each count of their line means.

services:
  seed:
    command: ["seed-pool"]
    environment:
      Demo__Enabled: "true"

  # The page carries the demo's tag, the claim is answered and registration is closed. The BFF
  # holds no key of the demo's.
  bff:
    environment:
      Demo__Enabled: "true"

  # The API hands out the copies. The key is given to this service alone: the pool's containers
  # do not get it. Compose asks for it all the same when it loads this file, whichever service is
  # named: `run --rm recycle`, `run --rm seed seed-pool 5` and `down` stop, as `up` does, until
  # DEMO_CLIENT_KEY_SECRET is set.
  api:
    environment:
      Demo__Enabled: "true"
      Demo__ClientKeySecret: ${DEMO_CLIENT_KEY_SECRET:?set DEMO_CLIENT_KEY_SECRET}

  recycle:
    # The tools image the other one-shots run; a path here is read from compose.yaml's folder.
    build:
      context: .
      dockerfile: backend/tools/AzureBank.Seeder/Dockerfile
    image: ${COMPOSE_PROJECT_NAME}-tools
    command: ["recycle"]
    profiles: ["pool"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AzureBank;User Id=sa;Password='${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}';TrustServerCertificate=true"
      Security__PinPepper: ${PIN_PEPPER:?set PIN_PEPPER}
      Demo__Enabled: "true"
