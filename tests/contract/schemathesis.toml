# Schemathesis 4.27.1 configuration for the AzureBank API -- the version CI pins
# (SCHEMATHESIS_VERSION in .github/workflows/ci.yml). Run from the repository ROOT, and pass this
# file as a GLOBAL option, before `run`:
#
#   export AZUREBANK_SERVICE_KEY="..."    # the value of the API's ServiceCredential:BffKey
#   schemathesis --config-file tests/contract/schemathesis.toml run docs/api/openapiv1.json
#
# What it adds to that command: the service key and a bearer token on every request (hooks.py),
# and the four response checks CI's conformance job runs, no others. At the bottom, three
# operations carry what `--checks all` has to be told about them.
#
# Schemathesis also loads a file with this name BY ITSELF from the working directory and its
# parents. From tests/contract/ it therefore applies without the flag -- and stops the run there,
# because the `hooks` module below resolves only from the repository root.
#
# Until 2026-09-23 this was a v3-era file that 4.27.1 refused to load (backlog row 39): a
# [[project]] without the `title` 4.27.1 requires, a list where [phases] takes a boolean, and a
# [network] section 4.27.1 does not have. Everything now sits at the root, so no project title
# has to match the document's.

color = true
seed = 42
max-failures = 10

base-url = "http://localhost:5068"
workers = 1
continue-on-failure = true
wait-for-schema = 30

# Seconds.
request-timeout = 30
# No tls-verify here, on purpose: certificate verification stays ON. The hooks send the service
# key on every request, and a file that switched verification off would switch it off for any
# --url given with it. For the local HTTPS profile's development certificate, see the README.

# The service key and the throwaway user's bearer token. A dotted module, resolved from the
# working directory -- hence the repository root.
hooks = "tests.contract.hooks"

[phases]
# All four -- examples, coverage, fuzzing and stateful -- as in CI.
enabled = true

[generation]
max-examples = 100
# Positive and negative inputs.
mode = "all"

[checks]
# CI's four (the Response conformance step in .github/workflows/ci.yml) and only those. CI leaves
# the input-side checks out on purpose, and a local run that adds them reports failures CI never
# will.
enabled = false
status_code_conformance.enabled = true
content_type_conformance.enabled = true
response_headers_conformance.enabled = true
response_schema_conformance.enabled = true

# Two answers the missing_required_header check calls wrong and the ADRs decided.
# POST /api/transactions/withdraw and POST /api/transfers without Step-Up-Authorization, for an
# account that does not exist, answer 404, where the check expects 400, 401, 403, 406, 415 or 422.
# The account's 404 comes before the missing header's 401 by ADR-0056 (D4) on the withdrawal and
# ADR-0042 on the transfer, where it keeps a caller without the second factor from asking which
# payees exist. The check runs only under `--checks all`: this block does not switch it on for the
# default run (measured 2026-09-24).
#
# 4.27.1 REPLACES the check's list with this one rather than adding to it, hence the whole default
# plus 404. And a list is per operation, not per header: on these two a missing Idempotency-Key
# could now answer 404 without this check noticing. The backend suite pins that one at 400
# IDEMPOTENCY_KEY_MISSING (IdempotencyEndpointTests).
[[operations]]
include-name = "POST /api/transactions/withdraw"
checks.missing_required_header.expected-statuses = [400, 401, 403, 404, 406, 415, 422]

[[operations]]
include-name = "POST /api/transfers"
checks.missing_required_header.expected-statuses = [400, 401, 403, 404, 406, 415, 422]

# The transaction list ignores a query parameter it does not declare, as ASP.NET Core does, and
# answers ?x-schemathesis-unknown-property=42 with 200. Schemathesis reads the query as a closed
# object and reports "API accepted schema-violating request"; the contract does not say the query
# is closed, and refusing unknown parameters would be a policy of its own, for every caller. So
# the list is sent none -- the one operation `--checks all` sent one to (measured 2026-09-24).
[[operations]]
include-name = "GET /api/transactions"
generation.allow-extra-parameters = false
